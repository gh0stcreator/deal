version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ladno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deal
      POSTGRES_USER: deal
      POSTGRES_PASSWORD: deal
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
